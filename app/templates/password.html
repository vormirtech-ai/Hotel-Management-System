{% extends "base.html" %}
{% from "_macros.html" import icon, csrf, badge, field, err with context %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1></div></div>
<div class="card" style="max-width:520px"><div class="card-body">
  <form method="post" class="stack">
    {{ csrf() }}
    <div class="field"><label for="current">Current password</label><input id="current" type="password" name="current" required autocomplete="current-password">{{ err(errors, 'current') }}</div>
    <div class="field"><label for="new">New password</label><input id="new" type="password" name="new" required minlength="8" autocomplete="new-password">{{ err(errors, 'new') }}</div>
    <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" name="confirm" required autocomplete="new-password">{{ err(errors, 'confirm') }}</div>
    <div><button class="btn btn-primary">Save password</button></div>
  </form>
</div></div>
{% endblock %}
